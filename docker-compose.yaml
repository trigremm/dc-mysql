services:
  mysql:
    image: mysql:8.0.44-debian
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - 3306:3306
    restart: always
    volumes:
      - ./.docker_volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
